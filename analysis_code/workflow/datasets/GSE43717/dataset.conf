DATASET_ID="GSE43717"
DATASET_LABEL="Soumillon et al. 2013 purified mouse testicular cell types"
DEFAULT_DATASET_ROOT="${SRA_ROOT:-${PWD}/data}/GSE43717"
# Reference preparation is identical for every dataset. Reuse the existing,
# fingerprinted Ensembl 110/GRCm39 reference instead of building another copy.
DEFAULT_REFERENCE_DIR="${PRDX4T_REFERENCE_DIR:-${SRA_ROOT:-${PWD}/data}/reference}"
RUN_MANIFEST_FILE="runs.tsv"
PLOT_DATASET_LABEL="GSE43717 (Soumillon et al., 2013)"
# Single-end libraries; three sequencing lanes per GEO sample are processed
# separately for run-level QC and grouped by SampleID in workflow step 04.
# Sertoli cells are retained as the non-germ-cell baseline of the series.
MAIN_STAGE_GROUPS="SL,SG,SC,SD,SZ"

# Main-analysis sample filter (WT-only design). Format: Column=value[,value...]
# Empty keeps every sample in the configured main stage groups.
WT_SAMPLE_FILTER=""
